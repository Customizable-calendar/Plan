name: Deploy stage

# stage에 머지되면 stage 환경에 올려요. main은 운영 전까지 배포하지 않아요.
# 설정값이 없으면 해당 단계는 건너뛰어요. 설정 순서는 docs/deploy.md
on:
  push:
    branches: [stage]
  workflow_dispatch:

# 배포가 겹치면 앞의 것이 끝난 뒤에 실행해요.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    environment: stage
    outputs:
      supabase: ${{ steps.check.outputs.supabase }}
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase stage 설정이 없어서 DB·함수 배포를 건너뛰어요. docs/deploy.md 2번"
          fi
          if [ -n "$EXPO_TOKEN" ] && grep -q '"expo-updates"' apps/mobile/package.json; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN 또는 expo-updates가 없어서 앱 업데이트를 건너뛰어요. docs/deploy.md 3번"
          fi

  supabase:
    needs: ready
    if: needs.ready.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    environment: stage
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROJECT_REF"
      # 아직 적용 안 된 마이그레이션만 순서대로 적용해요.
      - run: supabase db push --linked
      - name: Edge Functions 배포
        run: |
          if ls -d supabase/functions/*/ >/dev/null 2>&1; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "배포할 함수가 아직 없어요."
          fi

  app:
    needs: [ready, supabase]
    # DB 배포를 건너뛴 경우에도 앱은 올리고, DB 배포가 실패하면 올리지 않아요.
    if: always() && needs.ready.outputs.app == 'true' && needs.supabase.result != 'failure'
    runs-on: ubuntu-latest
    environment: stage
    # 새 APK를 빌드하면 머지된 PR에 링크를 남겨요.
    permissions:
      contents: read
      pull-requests: write
    # 앱 업데이트와 웹 버전이 같은 stage 설정을 써요. (공개돼도 되는 EXPO_PUBLIC_* Variable만)
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_STORAGE_PROVIDER: supabase
      # 기능 데이터 출처: fixtures(예시 JSON) | supabase. M2에 stage 환경 변수로 supabase로 바꿔요
      EXPO_PUBLIC_DATA_SOURCE: ${{ vars.EXPO_PUBLIC_DATA_SOURCE || 'fixtures' }}
      # 연결 끝난 기능만 supabase로 (쉼표로 기능 id). lib/data-source.ts sourceFor
      EXPO_PUBLIC_SUPABASE_FEATURES: ${{ vars.EXPO_PUBLIC_SUPABASE_FEATURES }}
      # 웹 주소 https://<이 값>.expo.app (처음 올릴 때 정해지고 그 뒤로 그대로)
      WEB_DOMAIN: customcal-noteapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # stage 빌드를 깐 폰은 앱을 다시 열면 이 업데이트를 받아요.
      - name: stage 채널로 업데이트 올리기
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel stage --message "${MESSAGE:-수동 배포}" --non-interactive
      # 네이티브 부분(라이브러리, app.json 권한·플러그인, SDK)이 바뀌면 예전 APK는 위 업데이트를 못 받아요.
      # 같은 fingerprint의 stage APK가 없으면 새로 빌드해요. (scripts/native-check.mjs)
      - name: APK를 새로 빌드해야 하는지 보기
        id: native
        run: node scripts/native-check.mjs
      - name: stage APK 새로 빌드
        if: steps.native.outputs.needs_build == 'true'
        id: build
        working-directory: apps/mobile
        run: |
          eas build --profile stage --platform android --non-interactive --no-wait --json > build.json
          id=$(node -e "console.log(require('./build.json')[0].id)")
          url="https://expo.dev/accounts/choengs-team/projects/noteapp/builds/$id"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 📦 stage APK를 새로 빌드해요"
            echo "네이티브 부분이 바뀌어서 예전 APK는 이번 업데이트를 못 받아요. 15~20분 뒤 아래 링크에서 새로 깔아 주세요."
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 머지된 PR에 새 APK 링크 남기기
        if: steps.native.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.build.outputs.url }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" -q '.[0].number' || true)
          if [ -n "$pr" ]; then
            gh pr comment "$pr" -R "${{ github.repository }}" --body "📦 이 PR로 네이티브 부분이 바뀌어서 stage APK를 새로 빌드하고 있어요. 15~20분 뒤 새로 깔아 주세요 (예전 APK는 이 뒤의 업데이트를 못 받아요). $URL"
          fi
      # 아이폰은 이 웹 주소로 봐요(설치·컴퓨터 없이). 받아쓰기처럼 폰 네이티브가 필요한 건 웹에서 안 돼요.
      # 웹이 실패해도 앱 업데이트·APK 빌드는 그대로 가요.
      - name: 웹 버전 올리기 (EAS Hosting)
        id: web
        continue-on-error: true
        working-directory: apps/mobile
        env:
          # 웹에는 업데이트 채널이 없어서 stage 표시를 따로 줘요 (features/cards/session.ts isTestBuild)
          EXPO_PUBLIC_TEST_BUILD: 'true'
        run: |
          npx expo export --platform web --output-dir dist
          eas deploy --prod --non-interactive --dev-domain "$WEB_DOMAIN"
          {
            echo "### 🌐 웹 버전 (아이폰은 사파리로)"
            echo "https://$WEB_DOMAIN.expo.app"
          } >> "$GITHUB_STEP_SUMMARY"
